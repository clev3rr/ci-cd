name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  build-n-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://lab4:lab4-ci-pass@127.0.0.1:5433/lab4_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lab4_test
          POSTGRES_USER: lab4
          POSTGRES_PASSWORD: lab4-ci-pass
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lab4 -d lab4_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

  call-docker-workflow:
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image_name: maksimmaliutin/ci-cd
      image_tag: latest
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  build-frontend:
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image_name: maksimmaliutin/ci-cd-frontend
      image_tag: latest
      build_context: ./frontend
      artifact_name: docker-image-frontend
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  build-migrations:
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image_name: maksimmaliutin/ci-cd-migrations
      image_tag: latest
      dockerfile: Dockerfile.migrations
      artifact_name: docker-image-migrations
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  package-helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Validate Helm chart
        run: |
          helm lint k8s/lab4 --strict
          helm lint k8s/lab4 --strict -f k8s/lab4/values.kind.yaml
          helm template lab4 k8s/lab4 -n lab4 -f k8s/lab4/values.kind.yaml > /dev/null

      - name: Package Helm chart
        run: |
          mkdir -p dist
          helm package k8s/lab4 --destination dist

      - name: Upload Helm chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error
