name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  build-n-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

  call-docker-workflow:
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image_name: maksimmaliutin/ci-cd
      image_tag: latest
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}