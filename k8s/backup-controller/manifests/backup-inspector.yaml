apiVersion: v1
kind: Pod
metadata:
  name: backup-inspector
  namespace: demo
spec:
  restartPolicy: Never
  containers:
    - name: postgres-client
      image: postgres:16
      command: ["sleep", "300"]
      volumeMounts:
        - name: backups
          mountPath: /backups
  volumes:
    - name: backups
      persistentVolumeClaim:
        claimName: postgres-backups
