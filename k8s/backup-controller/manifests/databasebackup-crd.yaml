apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databasebackups.backup.example.com
spec:
  group: backup.example.com
  scope: Namespaced
  names:
    plural: databasebackups
    singular: databasebackup
    kind: DatabaseBackup
    shortNames:
      - dbbackup
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - schedule
                - connectionSecretName
                - backupPVCName
              properties:
                schedule:
                  type: string
                  minLength: 1
                timeZone:
                  type: string
                  default: Etc/UTC
                connectionSecretName:
                  type: string
                  minLength: 1
                backupPVCName:
                  type: string
                  minLength: 1
